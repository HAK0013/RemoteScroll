name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RemoteScroll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: RemoteScroll/app/build/outputs/apk/debug/*.apk

      - name: Upload APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Skipping Telegram upload: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set."
            exit 0
          fi
          APK_FILE=$(ls -t app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          FILENAME=$(basename "$APK_FILE")
          COMMIT_MSG=$(git log -1 --pretty=%s)
          CAPTION=$(printf 'RemoteScroll APK Update: %s\nCommit: %s - %s' "$FILENAME" "${GITHUB_SHA:0:7}" "$COMMIT_MSG")
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_FILE}" \
            -F "caption=${CAPTION}")
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "Telegram upload failed: $RESPONSE"; exit 1; }
          echo "Uploaded ${FILENAME} to Telegram."
